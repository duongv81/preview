<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Asset GIF Previewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark">
  <div class="ambient-glow"></div>

  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </div>
        <div>
          <h1>Game Asset GIF Previewer</h1>
          <p>Kho hiển thị & kiểm tra hiệu ứng hoạt ảnh</p>
        </div>
      </div>
      <div class="header-badges">
        <div class="badge">
          <span>Tổng số:</span>
          <strong id="badgeTotalGifs">0</strong> GIF
        </div>
        <div class="badge">
          <span>Danh mục:</span>
          <strong id="badgeTotalCats">0</strong>
        </div>
      </div>
    </header>

    <div class="controls-panel">
      <!-- Category Tabs (Tất cả, Vòng ánh sáng, Đeo lưng,...) -->
      <div class="tabs-row" id="categoryTabs"></div>

      <!-- Filters & Sliders Row -->
      <div class="inputs-row">
        <!-- Search -->
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="Tìm kiếm GIF theo tên...">
        </div>

        <!-- Size Slider -->
        <div class="slider-control" title="Kéo thanh trượt để thay đổi kích thước hiển thị">
          <label>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            Kích thước:
          </label>
          <input type="range" id="sizeSlider" min="140" max="420" value="220" step="10">
          <span class="slider-val" id="sizeVal">220px</span>
        </div>

        <!-- Background Mode Selector -->
        <div class="bg-selector" title="Thay đổi màu nền để kiểm tra độ trong suốt & tương phản">
          <button class="bg-opt dark active" data-bg="bg-dark" title="Nền Tối Studio"></button>
          <button class="bg-opt black" data-bg="bg-black" title="Nền Đen Tuyệt Đối"></button>
          <button class="bg-opt checker" data-bg="bg-checker" title="Nền Caro Trong Suốt (Alpha)"></button>
          <button class="bg-opt white" data-bg="bg-white" title="Nền Sáng"></button>
        </div>

        <!-- View Mode Switcher -->
        <div class="view-switcher">
          <button class="view-btn active" id="viewGridBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            Lưới
          </button>
          <button class="view-btn" id="viewCarouselBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="7" width="20" height="14" rx="2"></rect>
              <path d="M16 3H8"></path>
            </svg>
            Trượt
          </button>
        </div>
      </div>
    </div>

    <!-- Carousel Slider View -->
    <div class="carousel-view" id="carouselView">
      <div class="carousel-stage">
        <span class="card-badge-cat" id="carouselCat">Danh mục</span>
        <img id="carouselImg" src="" alt="Preview">
        <div style="margin-top: 14px; text-align: center;">
          <h3 id="carouselTitle" style="font-size: 1.1rem; color: #fff;"></h3>
          <p id="carouselMeta" style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;"></p>
        </div>
      </div>
      <div class="carousel-controls">
        <button class="carousel-btn" id="carouselPrevBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
          GIF Trước
        </button>
        <span id="carouselCounter" style="font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; color: #38bdf8;">1 / 14</span>
        <button class="carousel-btn" id="carouselNextBtn">
          GIF Kế Tiếp
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
      <div class="carousel-strip" id="carouselStrip"></div>
    </div>

    <!-- Gallery Grid -->
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>

  <!-- Lightbox Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Tên File GIF</h3>
        <button class="modal-close" id="modalCloseBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-body">
        <button class="modal-nav prev" id="modalPrevBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <img id="modalImg" src="" alt="GIF Preview">
        <button class="modal-nav next" id="modalNextBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
      <div class="modal-footer">
        <div class="modal-info-list">
          <div>Danh mục: <strong id="modalCat">-</strong></div>
          <div>Dung lượng: <strong id="modalSize">-</strong></div>
          <div>Kích thước: <strong id="modalDim">-</strong></div>
        </div>
        <div class="modal-buttons">
          <button class="btn-action" id="modalCopyBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            Sao chép Link
          </button>
          <a class="btn-action" id="modalDownloadBtn" download>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Tải về
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Đã sao chép link GIF!</div>

  <script src="data.js?v=20261009023240"></script>
  <script src="app.js?v=20261009023240"></script>
</body>
</html>
